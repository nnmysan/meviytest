# アクション提案のテンプレート。
# ・hypotheses は「原因の仮説」であり、データで確認された事実ではない（初期状態はすべて「未検証」）。
# ・checks は仮説を検証するための確認作業。仮説が「支持」されるまで提案は「確認・調査」にとどめる。
default:
  hypotheses:
    - 特定の顧客・案件の一時的な変動
    - 業務プロセスやデータ計上方法の変更
  checks:
    - 寄与の大きい内訳・顧客の明細を確認する
kpis:
  order_amount:
    hypotheses:
      - 見積依頼（引き合い）の減少
      - 見積→受注転換率の低下（価格・納期の競争力）
      - 特定顧客の発注時期のずれ・大口案件の反動
    checks:
      - 同じ内訳の見積件数と転換率の推移を確認する
      - 寄与の大きい顧客の発注予定を営業担当に確認する
  order_count:
    hypotheses:
      - 見積依頼（引き合い）の減少
      - 特定顧客の発注サイクルの変化
    checks:
      - 見積件数と転換率の推移を確認する
      - 前年同月・前月に発注があり当月ない顧客を一覧化する
  quote_conversion:
    hypotheses:
      - 価格競争力の低下（見積単価・値引きの変化）
      - 回答納期の長期化
      - 見積依頼の質の変化（比較目的の見積の増加など）
    checks:
      - 失注した見積の理由（価格・納期・仕様）を営業に確認する
      - 見積金額帯・商品別の転換率を比較する
  gross_margin:
    hypotheses:
      - 原価（材料費・外注費）の上昇
      - 値引き・価格改定の影響
    checks:
      - 商品別の粗利率と構成比の変化を確認する
      - 原価率が悪化した明細の材料・外注の内訳を確認する
  on_time_delivery:
    hypotheses:
      - 特定工程・設備の能力不足または停止
      - 外注先・材料調達の遅れ
      - 短納期案件の増加
    checks:
      - 遅延明細の遅延理由を区分する（工程・外注・材料・その他）
      - 遅延が集中している顧客・品目・工程を確認する
  defect_rate:
    hypotheses:
      - 特定工程・設備の品質のばらつき
      - 新規品目・難加工品の比率増加
      - 検査基準・記録方法の変更
    checks:
      - 不良区分別・品目別に不良明細を確認する
      - 発生工程と流出経路を品質保証で確認する
# データから得られる示唆（分解結果）に応じて追加する仮説
signals:
  mix: 商品構成の変化によるもの（各商品の率は大きく変わっていない可能性）
  rate: 商品構成ではなく、各商品の率そのものの変化
  count: 件数の変化が主因（単価はおおむね横ばい）
  price: 単価の変化が主因（件数はおおむね横ばい）
  concentrated: 特定の内訳に変化が集中している
  persistent: 今月新たに起きた変化ではなく、数か月続いている水準の問題（未達が始まった月に要因がある可能性）
