[project]
name = "kpi-monthly"
version = "0.1.0"
description = "月次KPI管理（取込・データ品質・集計・分析・アラート・アクション提案・ダッシュボード出力）"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "duckdb>=1.1", "pyarrow>=15", "pyyaml>=6", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: ダミーデータ生成とパイプライン全体を実行する検証（数分かかる）"]
