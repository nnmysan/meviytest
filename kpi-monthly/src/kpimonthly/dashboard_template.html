<meta charset="utf-8">
<title>月次KPIボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f3f4f2; --surface:#ffffff; --surface-2:#eceeec; --ink:#15181b; --ink-2:#4f565d; --ink-3:#7b8389;
  --rule:#dde1df; --accent:#2a78d6; --accent-soft:#2a78d61f; --pos:#2a78d6; --neg:#e34948; --prior:#9aa2a7;
  --crit:#d03b3b; --serious:#ec835a; --warn:#fab219; --good:#0ca30c; --info:#7b8389;
  --dummy-bg:#fff4d6; --dummy-ink:#6b4b00;
  --font:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111314; --surface:#1a1c1e; --surface-2:#232628; --ink:#eef1f0; --ink-2:#b6bdc1; --ink-3:#899196;
    --rule:#2f3437; --accent:#3987e5; --accent-soft:#3987e52b; --pos:#3987e5; --neg:#e66767; --prior:#6f787d;
    --dummy-bg:#3a2f12; --dummy-ink:#f5d58a;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111314; --surface:#1a1c1e; --surface-2:#232628; --ink:#eef1f0; --ink-2:#b6bdc1; --ink-3:#899196;
  --rule:#2f3437; --accent:#3987e5; --accent-soft:#3987e52b; --pos:#3987e5; --neg:#e66767; --prior:#6f787d;
  --dummy-bg:#3a2f12; --dummy-ink:#f5d58a;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:0 48px}
.num,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.dummy{background:var(--dummy-bg);color:var(--dummy-ink);font-size:13px;padding:8px 20px;text-align:left}
.dummy b{font-weight:700}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:20px 12px}
header.top h1{font-size:22px;font-weight:700;letter-spacing:.01em}
header.top .sub{color:var(--ink-2);font-size:13px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2);font-size:12px}
.meta span b{color:var(--ink);font-weight:600}

nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--ink-2);white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--surface-2);font-size:11px;font-family:var(--mono)}
section.panel{padding-top:20px}
.lead{color:var(--ink-2);font-size:13px;max-width:72ch;margin:0 0 14px}
h2.sec{font-size:15px;font-weight:600;margin:24px 0 10px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font-weight:400;color:var(--ink-3);font-size:12px}

/* KPI tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--ink-3)}
.tile .name{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:500}
.tile .val{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.tile .rows{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:12px;color:var(--ink-2)}
.tile .rows dd{margin:0;text-align:right;font-family:var(--mono);color:var(--ink)}
.tile .rows dt{margin:0}
.tile svg{display:block;width:100%;height:44px}
.good-t{color:var(--good)} .bad-t{color:var(--crit)}
:root[data-theme="dark"] .good-t{color:#4cc24c}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:3px;border:1px solid var(--rule);background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:18px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;display:none}
.chip.p1{color:#fff;background:var(--crit);border-color:var(--crit)}
.chip.p1::before{display:block;background:#fff}
.chip.p2{color:var(--ink);border-color:var(--serious);background:transparent}
.chip.p2::before{display:block;background:var(--serious)}
.chip.p3{color:var(--ink);border-color:var(--warn);background:transparent}
.chip.p3::before{display:block;background:var(--warn)}
.chip.info{color:var(--ink-2)}
.chip.st-wait{color:var(--dummy-ink);background:var(--dummy-bg);border-color:transparent}
.chip.st-miss{color:#fff;background:var(--crit);border-color:var(--crit)}
.chip.lbl{background:transparent;border-style:dashed}

/* alerts */
.alist{display:flex;flex-direction:column;gap:8px}
.alert{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--info);border-radius:4px;padding:10px 14px;display:grid;gap:4px}
.alert.p1{border-left-color:var(--crit)} .alert.p2{border-left-color:var(--serious)} .alert.p3{border-left-color:var(--warn)}
.alert .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.alert .hd .what{font-weight:600}
.alert .msg{margin:0}
.alert ul{margin:2px 0 0;padding-left:18px;color:var(--ink-2);font-size:13px}
.alert .ft{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12px;color:var(--ink-3)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:12px;font-weight:500}
.linkbtn:hover{text-decoration:underline}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:.02em}
.filters select{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:5px 8px;min-width:120px;max-width:220px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 10px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* analysis */
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.card h3{font-size:13px;font-weight:600;margin-bottom:2px}
.card .cap{font-size:12px;color:var(--ink-3);margin:0 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--ink-3);font-family:var(--mono);font-size:10.5px}
.chart .lab{fill:var(--ink-2);font-family:var(--font);font-size:11.5px}
.chart .grid line{stroke:var(--rule);stroke-width:1}
.summary-line{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin:0 0 8px}
.summary-line b{font-family:var(--mono);font-weight:500}
.kv{display:flex;flex-wrap:wrap;gap:4px 20px;margin:6px 0 0;font-size:13px}
.kv div span{color:var(--ink-3);margin-right:6px;font-size:12px}

.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.02em;background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.muted{color:var(--ink-3)}

/* actions */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
@media (max-width:520px){.acts{grid-template-columns:1fr}}
.act{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.act h3{font-size:14px;font-weight:600;line-height:1.45}
.act .blk{display:grid;gap:3px}
.act .blk > span{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.act ul{margin:0;padding-left:18px}
.act li{margin:1px 0}
.hyp{display:flex;gap:8px;align-items:baseline}
.hyp .chip{flex:none}
.act .own{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:2px 20px;font-size:12px;border-top:1px solid var(--rule);padding-top:8px}
.act .own span{color:var(--ink-3);display:block;font-size:11px}

/* DQ matrix */
.matrix td,.matrix th{text-align:center}
.cell{display:inline-flex;flex-direction:column;align-items:center;gap:0;font-size:12px;line-height:1.3}
.cell .s{font-weight:600}
.cell.ok .s{color:var(--good)} .cell.miss .s{color:var(--crit)} .cell.late .s{color:#b86a00}
:root[data-theme="dark"] .cell.late .s{color:var(--warn)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--crit);border-left-width:4px;border-radius:4px;padding:10px 14px;margin-top:14px}
.banner.ok{border-color:var(--rule);border-left-color:var(--good)}
.empty{color:var(--ink-3);font-size:13px;padding:10px 0}

#tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 9px;border-radius:4px;max-width:280px;line-height:1.45;box-shadow:0 4px 14px #0003}
#tip b{font-weight:600}
@media (prefers-reduced-motion:no-preference){.tile,.alert{transition:border-color .15s}}
@media (max-width:560px){.wrap{padding-inline:16px} header.top h1{font-size:19px} .tile .val{font-size:22px}}
/* 期間・ダウンロード・サプライヤ（追加） */
:root{ --series2:#eb6834; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --series2:#d95926; } }
:root[data-theme="dark"]{ --series2:#d95926; }
.small{font-size:12px}
.periodbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:4px 0 12px}
.periodbar .inline{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3)}
.periodbar select{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:4px 6px}
.nohour{height:48px;display:flex;align-items:center}
.dl{display:inline-flex;gap:4px;margin-left:auto}
h2.sec .dl,h3 .dl{margin-left:10px}
.card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .dl{margin-left:auto}
.dlbtn{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:1px 7px;font-size:11px;color:var(--ink-2);cursor:pointer;font-weight:500}
.dlbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.tile.static{cursor:default}
.tile.static .val{font-size:22px}
.lbar{display:inline-block;position:relative;width:90px;height:8px;background:var(--surface-2);border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}
.lbar span{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.lbar i{position:absolute;top:-2px;bottom:-2px;width:0;border-left:1.5px dashed var(--ink-2)}
table.heat th,table.heat td{text-align:center;white-space:nowrap;font-size:12px;padding:6px 8px}
table.heat tbody th{text-align:left;background:var(--surface)}
td.hm{background:color-mix(in srgb, var(--accent) calc(var(--a) * 100%), var(--surface));font-family:var(--mono)}
td.hm.warn{background:color-mix(in srgb, var(--serious) 55%, var(--surface));font-weight:600;color:var(--ink)}
td.hm.crit{background:var(--crit);color:#fff;font-weight:600}
td.empty-c{background:var(--surface)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;z-index:60}
</style>

<div id="dummy" class="dummy" hidden></div>
<div class="wrap">
  <header class="top">
    <div>
      <h1>月次KPIボード</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<div id="tip" hidden></div>
<div id="toast" role="status" hidden></div>

<script id="kpi-data" type="application/json">__DATA__</script>
<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById("kpi-data").textContent);
const M = D.manifest, TM = M.target_month, END = M.data_end || M.as_of;
const KPI = Object.fromEntries(D.kpis.map(k => [k.id, k]));
const MONTHS = D.months, M13 = MONTHS.slice(-13);
const DIMS = D.dims;
const SEC = Object.fromEntries(D.org.map(o => [o.section_code, o]));
const DIM_LABEL = {entity_code:"現地法人", product_code:"商品", division_code:"事業部", team_code:"チーム", section_code:"課", industry:"業種", size_class:"顧客規模", customer_id:"顧客",
  supplier_code:"サプライヤ", material:"材質", part_size:"サイズ", surface:"表面処理", heat:"熱処理"};
const DAILY_DIMS = ["entity_code", "product_code", "division_code", "team_code", "section_code"];
const PRIO = {P1:1, P2:2, P3:3, INFO:4};
const PRIO_LABEL = {P1:"P1 要対応", P2:"P2 要確認", P3:"P3 注視", INFO:"情報"};
const WEEK = ["日","月","火","水","木","金","土"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);

// ---------- 日付
const dt = s => new Date(s + "T00:00:00Z");
const ds = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = dt(s); d.setUTCDate(d.getUTCDate() + n); return ds(d); };
const isWd = s => { const g = dt(s).getUTCDay(); return g > 0 && g < 6; };
const weekStart = s => { const g = (dt(s).getUTCDay() + 6) % 7; return addDays(s, -g); };
const daysBetween = (a, b) => { const out = []; for (let s = a; s <= b; s = addDays(s, 1)) out.push(s); return out; };
const wdCount = (a, b) => daysBetween(a, b).filter(isWd).length;
const monthEnd = m => { const d = dt(m + "-01"); d.setUTCMonth(d.getUTCMonth() + 1); d.setUTCDate(0); return ds(d); };
const wdMonth = m => wdCount(m + "-01", monthEnd(m));
const dlabel = s => `${+s.slice(5, 7)}/${+s.slice(8)}（${WEEK[dt(s).getUTCDay()]}）`;
const mlabel = m => `${m.slice(0,4)}年${+m.slice(5)}月`;
const mshort = m => `${+m.slice(5)}月`;
const CUR_M = END.slice(0, 7);

// ---------- 月次の細粒度データ（任意の絞り込みで分子・分母を合計してから割る）
const FC = D.fine_cols, F = {};
FC.forEach((c, i) => F[c] = D.fine.map(r => r[i]));
F.team_code = F.section_code.map(s => SEC[s]?.team_code ?? "UNK");
F.division_code = F.section_code.map(s => SEC[s]?.division_code ?? "UNK");
const NF = D.fine.length;
const CC = D.cust_cols, C = {};
CC.forEach((c, i) => C[c] = D.cust.map(r => r[i]));
const NC = D.cust.length;
const SER = new Map();
D.series.forEach(r => { const o = Object.fromEntries(D.series_cols.map((c, i) => [c, r[i]])); SER.set(`${o.kpi_id}|${o.scope_key}|${o.month}`, o); });
const TGT = new Map(D.targets.map(r => [`${r[0]}|${r[1]}|${r[3]}`, r[4]]));

function agg(kid, months, filt, by) {
  const out = new Map(); const ms = new Set(months);
  for (let i = 0; i < NF; i++) {
    if (F.kpi_id[i] !== kid || !ms.has(F.month[i])) continue;
    let ok = true;
    for (const d in filt) if (filt[d] && F[d][i] !== filt[d]) { ok = false; break; }
    if (!ok) continue;
    const k = (by ? F[by][i] : "ALL") + "|" + F.month[i];
    const o = out.get(k) || {num:0, den:0, afx:0};
    o.num += F.num[i] || 0; o.den += F.den[i] || 0; o.afx += F.actual_fx[i] || 0;
    out.set(k, o);
  }
  return out;
}
function aggCust(kid, months, filt) {
  const out = new Map(); const ms = new Set(months);
  for (let i = 0; i < NC; i++) {
    if (C.kpi_id[i] !== kid || !ms.has(C.month[i])) continue;
    let ok = true;
    for (const d in filt) {
      if (!filt[d]) continue;
      const v = d === "team_code" ? SEC[C.section_code[i]]?.team_code : d === "division_code" ? SEC[C.section_code[i]]?.division_code : C[d]?.[i];
      if (v !== filt[d]) { ok = false; break; }
    }
    if (!ok) continue;
    const k = C.customer_id[i] + "|" + C.month[i];
    const o = out.get(k) || {num:0, den:0};
    o.num += C.num[i] || 0; o.den += C.den[i] || 0; out.set(k, o);
  }
  return out;
}

// ---------- 日別・時間別
const DY = D.daily || {rows: [], days: [], kpis: [], ents: [], prds: [], secs: []};
const DDAYS = DY.days;
const DYA = {k: [], d: [], e: [], p: [], s: [], team: [], div: [], num: [], den: [], afx: []};
DY.rows.forEach(r => {
  const sec = DY.secs[r[4]];
  DYA.k.push(DY.kpis[r[0]]); DYA.d.push(DDAYS[r[1]]); DYA.e.push(DY.ents[r[2]]); DYA.p.push(DY.prds[r[3]]); DYA.s.push(sec);
  DYA.team.push(SEC[sec]?.team_code ?? "UNK"); DYA.div.push(SEC[sec]?.division_code ?? "UNK");
  DYA.num.push(r[5] || 0); DYA.den.push(r[6] || 0); DYA.afx.push(r[7] || 0);
});
const DCOL = {entity_code: "e", product_code: "p", section_code: "s", team_code: "team", division_code: "div"};
const HR = D.hourly || {rows: [], kpis: []};
const HRA = HR.rows.map(r => ({k: DY.kpis[r[0]], d: DDAYS[r[1]], h: r[2], e: DY.ents[r[3]], p: DY.prds[r[4]], s: DY.secs[r[5]], num: r[6] || 0, den: r[7] || 0}));
HRA.forEach(o => { o.team = SEC[o.s]?.team_code; o.div = SEC[o.s]?.division_code; });
const dailyOk = filt => Object.entries(filt).every(([d, v]) => !v || DAILY_DIMS.includes(d));

function aggDays(kid, days, filt, by) {
  const out = new Map(); const set = new Set(days);
  for (let i = 0; i < DYA.k.length; i++) {
    if (DYA.k[i] !== kid || !set.has(DYA.d[i])) continue;
    let ok = true;
    for (const d in filt) if (filt[d] && DYA[DCOL[d]][i] !== filt[d]) { ok = false; break; }
    if (!ok) continue;
    const k = (by ? DYA[DCOL[by]][i] : "ALL");
    const o = out.get(k) || {num:0, den:0, afx:0};
    o.num += DYA.num[i]; o.den += DYA.den[i]; o.afx += DYA.afx[i]; out.set(k, o);
  }
  return out;
}
function aggHours(kid, day, filt) {
  const out = Array.from({length: 24}, () => ({num: 0, den: 0}));
  let any = false;
  for (const o of HRA) {
    if (o.k !== kid || o.d !== day) continue;
    let ok = true;
    for (const d in filt) if (filt[d] && o[DCOL[d]] !== filt[d]) { ok = false; break; }
    if (!ok) continue;
    out[o.h].num += o.num; out[o.h].den += o.den; any = true;
  }
  return any || HR.kpis.includes(kid) ? out : null;
}
const val = (k, o) => !o ? null : KPI[k].type === "sum" ? o.num : (o.den > 0 ? o.num / o.den : null);

// ---------- 期間
const PERIODS = [["all", "全期間"], ["6m", "半年"], ["3m", "四半期"], ["1m", "1ヶ月"], ["1w", "1週間"], ["1d", "1日"]];
function periodDef(p) {
  if (p === "all") {
    const keys = [...MONTHS]; if (CUR_M > TM && !keys.includes(CUR_M)) keys.push(CUR_M);
    return {grain: "month", keys, label: m => m === CUR_M && CUR_M > TM ? `${mshort(m)}（途中）` : mshort(m), full: mlabel};
  }
  if (p === "6m" || p === "3m") {
    const n = p === "6m" ? 26 : 13, last = weekStart(END), keys = [];
    for (let i = n - 1; i >= 0; i--) keys.push(addDays(last, -7 * i));
    return {grain: "week", keys, label: w => `${+w.slice(5, 7)}/${+w.slice(8)}`, full: w => `${dlabel(w)}の週`};
  }
  if (p === "1m" || p === "1w") {
    const n = p === "1m" ? 30 : 7, keys = [];

    return {grain: "day", keys, label: d => `${+d.slice(5, 7)}/${+d.slice(8)}`, full: dlabel, cmp: d => addDays(d, -7), cmpLabel: "前週同曜日"};
  }

}
function daysOfBucket(grain, key) {

  if (grain === "week") return daysBetween(key, addDays(key, 6)).filter(d => d <= END);
  return [key];
}
// バケットごとの値。月は締め月まで月次データ、当月途中・週・日は日別データ、時間は時間別データ
function bucketVal(kid, grain, key, filt) {
  if (grain === "month" && key <= TM && key !== CUR_M) return val(kid, agg(kid, [key], filt, null).get("ALL|" + key));
  if (!dailyOk(filt)) return null;
  const days = daysOfBucket(grain, key).filter(d => DDAYS.includes(d));

  return val(kid, aggDays(kid, days, filt, null).get("ALL"));

  return null;

function bucketTarget(kid, grain, key, filt) {

  const k = KPI[kid];

  if (grain === "month") return mt(key) ?? null;
  if (grain === "hour") return null;

  if (def.grain === "day") return def.cmp && dailyOk(filt) && DDAYS.includes(def.cmp(key)) ? val(kid, aggDays(kid, [def.cmp(key)], filt, null).get("ALL")) : null;

}

// ---------- 小さなグラフ（目標線つき）
function spark(k, pts) {
  const W = 240, H = 48, pad = 4;
  const vs = pts.map(p => p.v), ts = pts.map(p => p.t);
  const all = [...vs, ...ts].filter(v => v != null);
  if (all.length < 2) return `<svg viewBox="0 0 ${W} ${H}"></svg>`;
  let lo = Math.min(...all), hi = Math.max(...all);
  if (hi === lo) { hi += Math.abs(hi) * 0.1 || 1; lo -= Math.abs(lo) * 0.1 || 1; }
  const x = i => pad + i * (W - pad * 2) / Math.max(pts.length - 1, 1);
  const y = v => H - pad - (v - lo) / (hi - lo) * (H - pad * 2);
  const path = arr => { let d = "", pen = false; arr.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; }); return d; };
  const line = path(vs);
  const idx = vs.map((v, i) => [i, v]).filter(p => p[1] != null);
  const area = idx.length > 1 ? line + `L${x(idx.at(-1)[0]).toFixed(1)},${H}L${x(idx[0][0]).toFixed(1)},${H}Z` : "";
  const last = idx.at(-1);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(KPI[k].name)}の推移と目標">
    <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
    <path d="${path(ts)}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    ${last ? `<circle cx="${x(last[0])}" cy="${y(last[1])}" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>` : ""}</svg>`;
}

        <dt>目標</dt><dd>${tgt != null && cur != null ? `${fv(k.id, tgt)}　<span class="${tone(k.id, cur - tgt)}">${pctK ? fd(k.id, cur - tgt) : (cur / tgt * 100).toFixed(0) + "%"}</span>` : "—"}</dd>
      </dl></button>`;
  }).join("");
  const repIds = new Set(D.actions.map(a => a.alert_id));
  const top = D.alerts.filter(a => repIds.has(a.alert_id) && a.category !== "供給");
  const supTop = D.alerts.filter(a => repIds.has(a.alert_id) && a.category === "供給");

  return `<section class="panel">

    ${top.length || supTop.length ? `<div class="alist">${[...top, ...supTop].map(a => alertCard(a, D.actions.find(x => x.alert_id === a.alert_id))).join("")}</div>` : `<p class="empty">今月、P1・P2 のアラートはありません。</p>`}
    <h2 class="sec">月次コメント <small>部門長・担当者の記入（事実／要因／対応）</small></h2>
    ${comments.length ? `<div class="tablewrap"><table><thead><tr><th>KPI・内訳</th><th>記入者</th><th>事実</th><th>要因</th><th>対応</th></tr></thead><tbody>${comments.map(c =>
      `<tr><td>${esc(KPI[c.kpi_id]?.name ?? c.kpi_id)}<br><span class="muted">${esc(scopeLabel(c.scope_key))}</span></td><td>${esc(c.author)}</td><td>${esc(c.fact)}</td><td>${esc(c.cause)}</td><td>${esc(c.action)}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="empty">コメントは未記入です（config/review の comments.csv、本番では Microsoft Lists から取り込み）。</p>`}
  </section>`;
}

function renderPace() {
  const rows = (D.pace || []).filter(r => r.scope_key === "ALL");
  if (!rows.length) return "";
  const pa = D.alerts.filter(a => a.rule === "forecast");
  const r0 = rows[0];
  const body = rows.map(r => {
    const k = KPI[r.kpi_id]; if (!k) return "";
    const alert = pa.find(a => a.kpi_id === r.kpi_id && a.scope_key === "ALL");
    if (k.type === "sum") {
      const ach = r.achievement_forecast;
      return `<tr><td>${esc(k.name)}</td><td class="n">${fv(r.kpi_id, r.mtd)}</td><td class="n">${fv(r.kpi_id, r.pace_target)}</td>
        <td class="n">${fv(r.kpi_id, r.forecast)}</td><td class="n">${fv(r.kpi_id, r.target)}</td>
        <td class="n ${ach != null && ach < 1 ? "bad-t" : "good-t"}">${ach != null ? (ach * 100).toFixed(0) + "%" : "—"}</td><td>${alert ? chip(alert.priority) : ""}</td></tr>`;
    }
    const gapOk = r.mature && r.mtd != null && r.target != null;
    return `<tr><td>${esc(k.name)}</td><td class="n">${fv(r.kpi_id, r.mtd)}${r.mature ? "" : " " + statusChip("成熟待ち")}</td><td class="n muted">—</td><td class="n muted">${r.mature ? "（率）" : "—"}</td>
      <td class="n">${fv(r.kpi_id, r.target)}</td><td class="n ${gapOk ? tone(r.kpi_id, r.mtd - r.target) : "muted"}">${gapOk ? fd(r.kpi_id, r.mtd - r.target) : "確定後に判定"}</td><td>${alert ? chip(alert.priority) : ""}</td></tr>`;
  }).join("");
  const dlId = "pace";
  return `<h2 class="sec">${mlabel(r0.month)}の進捗 <small>${r0.bdays_elapsed}/${r0.bdays_total}営業日経過。着地見込みは単純な日割り（曜日・月末の偏りは考慮しない）</small>
      ${dlButtons(dlId, () => ({name: "当月進捗", headers: ["KPI", "範囲", "当月累計", "目標ペース", "着地見込み", "月目標", "見込み達成率"],
        rows: (D.pace || []).map(r => [KPI[r.kpi_id]?.name, r.scope_label, r.mtd, r.pace_target, r.forecast, r.target, r.achievement_forecast])}))}</h2>
    ${(() => { const top = pa.filter(a => ["P1", "P2"].includes(a.priority)).sort((a, b) => PRIO[a.priority] - PRIO[b.priority] || (a.scope_key === "ALL" ? -1 : 1));
      return top.length ? `<div class="alist" style="margin-bottom:10px">${top.slice(0, 4).map(a => alertCard(a)).join("")}</div>${top.length > 4 ? `<p class="muted small">ほか ${top.length - 4} 件の着地見込みアラートは <button class="linkbtn" data-go="alerts">アラートタブ</button> で確認できます。</p>` : ""}` : ""; })()}
    <div class="tablewrap"><table><thead><tr><th>KPI（全社）</th><th class="n">当月累計</th><th class="n">目標ペース</th><th class="n">着地見込み</th><th class="n">月目標</th><th class="n">見込み達成率・目標差</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`;
}

// ---------- アラートカード
function alertCard(a, act) {
  const sig = (a.signals || []);
  const rel = act?.related_scopes?.length ? `<div class="ft">同時にアラートが出ている内訳：${act.related_scopes.map(esc).join("、")}</div>` : "";
  const own = act ? `<span>担当：<b>${esc(act.owner)}</b>　期限：<b class="mono">${esc(act.due_date)}</b>　アクション：<b>${esc(act.status)}</b></span>` : "";
  const open = a.category === "供給" ? `data-sopen="${esc(a.scope_key)}"` : `data-open="${esc(a.kpi_id)}|${esc(a.scope_key)}|${esc(a.month)}"`;
  const prop = act?.proposals?.length ? `<ul>${act.proposals.map(p => `<li><b>打ち手（${esc(p.type)}）</b>：${esc(p.text)}</li>`).join("")}</ul>` : "";
  return `<article class="alert ${a.priority.toLowerCase()}">
    <div class="hd">${chip(a.priority)}<span class="what">${esc(a.kpi_name)} · ${esc(a.scope_label)}</span>
      <span class="chip">${esc(a.rule_label)}</span>${a.label ? `<span class="chip lbl">${esc(a.label)}</span>` : ""}
      ${a.category !== "供給" && a.rule !== "forecast" && a.month !== TM ? `<span class="chip st-wait" title="成熟待ちのため直近の確定月で判定">${mlabel(a.month)}で判定</span>` : ""}</div>
    <p class="msg">${esc(a.message)}</p>
    ${sig.length ? `<ul>${sig.map(s => `<li>データから言えること：${esc(s)}</li>`).join("")}</ul>` : ""}
    ${prop}${rel}
    <div class="ft">${own}<span>確認状況：<b>${esc(a.review_status || "未確認")}</b>${a.review_comment ? `（${esc(a.reviewer)}：${esc(a.review_comment)}）` : ""}</span>
      <button class="linkbtn" ${open}>${a.category === "供給" ? "サプライヤ画面で開く →" : "原因分析で開く →"}</button></div>
  </article>`;
}

// ---------- データ品質
function renderDQ() {
  const srcs = ["quotes", "orders", "shipments", "defects"];
  const ents = Object.keys(DIMS.entity_code);
  const miss = new Set(D.dq.filter(q => q.rule === "missing_file" && q.month === TM).map(q => q.source + "|" + q.entity));
  const cell = (s, e) => {
    const fl = D.file_log.filter(f => f.source === s && f.entity === e && f.month === TM && f.status === "loaded");
    if (miss.has(s + "|" + e)) return `<span class="cell miss"><span class="s">✕ 未着</span><span class="muted">期限超過</span></span>`;
    if (!fl.length) return `<span class="cell"><span class="s">—</span></span>`;
    const late = fl.some(f => f.batch > 1);
    const rows = fl.reduce((a, f) => a + f.rows, 0);
    return `<span class="cell ${late ? "late" : "ok"}"><span class="s">${late ? "△ 遅れて到着" : "✓ 到着"}</span><span class="muted mono">${rows.toLocaleString("ja-JP")}行</span></span>`;
  };
  const issues = D.dq;
  return `<section class="panel">
    <p class="lead">取り込み時に、未着・列構成の変化・不正な行・重複・未登録コード・件数と金額の照合・過去値の修正を自動で検査しています。P1 のうち「停止」は数字を誤る恐れがあるため集計を止める項目です。</p>
    <h2 class="sec">${mlabel(TM)}分の到着状況</h2>
    <div class="tablewrap"><table class="matrix"><thead><tr><th>データ</th>${ents.map(e => `<th>${esc(DIMS.entity_code[e])}</th>`).join("")}</tr></thead>
      <tbody>${srcs.map(s => `<tr><th style="text-align:left">${SRC_JP[s]}</th>${ents.map(e => `<td>${cell(s, e)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <h2 class="sec">検知した事項 <small>${issues.length}件</small>${dlButtons("dq", () => ({name: "データ品質", headers: ["優先度", "停止", "内容", "データ", "法人", "月", "件数", "詳細", "ファイル"],
      rows: issues.map(q => [q.priority, q.blocking ? "停止" : "", q.rule_label, SRC_JP[q.source] ?? q.source, q.entity, q.month, q.count, q.message, q.file])}))}</h2>
    ${issues.length ? `<div class="tablewrap"><table><thead><tr><th>優先度</th><th>内容</th><th>データ</th><th>法人</th><th>月</th><th class="n">件数</th><th>詳細</th></tr></thead><tbody>
      ${issues.map(q => `<tr><td>${chip(q.priority)}${q.blocking ? ` <span class="chip p1">停止</span>` : ""}</td><td>${esc(q.rule_label)}</td><td>${esc(SRC_JP[q.source] ?? KPI[q.source]?.name ?? q.source)}</td><td>${esc(q.entity)}</td><td class="mono">${esc(q.month)}</td><td class="n">${q.count || ""}</td><td>${esc(q.message)}${q.file ? `<br><span class="muted mono">${esc(q.file)}</span>` : ""}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="banner ok"><span>✓</span><div>今回の取り込みでデータ品質の問題は検知されませんでした。</div></div>`}
    <h2 class="sec">過去値の修正ログ <small>前回の集計（${esc(D.restatements[0]?.prev_run_id || "なし")}）との差</small></h2>
    ${D.restatements.length ? `<div class="tablewrap"><table><thead><tr><th>種類</th><th>KPI</th><th>内訳</th><th>月</th><th class="n">前回</th><th class="n">今回</th><th class="n">差</th></tr></thead><tbody>
      ${D.restatements.slice(0, 60).map(r => `<tr><td>${esc(r.kind)}</td><td>${esc(r.kpi_name)}</td><td>${esc(r.scope_label)}</td><td class="mono">${esc(r.month)}</td><td class="n">${fv(r.kpi_id, r.prev_run_value)}</td><td class="n">${fv(r.kpi_id, r.value)}</td><td class="n">${KPI[r.kpi_id].display === "percent" ? fd(r.kpi_id, r.change) : fp(r.rel_change)}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="empty">前回の集計からの修正はありません。</p>`}
    ${D.quarantine_summary.length ? `<h2 class="sec">隔離した行 <small>集計から除外（元ファイルは保管）</small></h2><div class="tablewrap"><table><thead><tr><th>データ</th><th>理由</th><th class="n">行数</th></tr></thead><tbody>${D.quarantine_summary.map(q => `<tr><td>${esc(SRC_JP[q.source] ?? q.source)}</td><td>${esc(q.reason)}</td><td class="n">${q.rows}</td></tr>`).join("")}</tbody></table></div>` : ""}

// ---------- 原因分析
function filterOptions(dim, cur, dict) {
  return `<option value="">すべて</option>` + Object.entries(dict || DIMS[dim]).map(([v, n]) => `<option value="${esc(v)}" ${cur === v ? "selected" : ""}>${esc(n)}</option>`).join("");
}
function renderAnalysis() {
  const k = state.kpi, K = KPI[k];
  const filt = state.filt;
  const def = periodDef(state.period);
  const kpiOpts = D.kpis.map(x => `<option value="${x.id}" ${x.id === k ? "selected" : ""}>${esc(x.name)}</option>`).join("");
  const monOpts = M13.slice().reverse().map(x => `<option value="${x}" ${x === state.month ? "selected" : ""}>${mlabel(x)}</option>`).join("");
  const monthly = def.grain === "month";
  const byList = monthly ? ["entity_code","product_code","division_code","team_code","section_code","industry","size_class","customer_id"] : DAILY_DIMS;
  if (!byList.includes(state.by)) state.by = "entity_code";
  const byOpts = byList.map(d => `<option value="${d}" ${d === state.by ? "selected" : ""}>${DIM_LABEL[d]}</option>`).join("");
  const filterDims = ["entity_code","division_code","team_code","product_code","industry","size_class"];
  const active = Object.entries(filt).filter(([, x]) => x);
  const pctK = K.display === "percent";
  const note = !monthly && !dailyOk(filt) ? `<p class="lead bad-t">業種・顧客規模の絞り込みは月単位（全期間）でのみ使えます。日・週・時間の表示では解除してください。</p>` : "";

  // 比較の窓：月＝選択月と前月。それ以外＝期間全体と、その直前の同じ長さの期間（1日＝前週同曜日）
  let curDays, prvDays, curLabel, prvLabel, seg, tot0, tot1;
  if (monthly) {

    ${pts.map((p, i) => p.v == null ? "" : `<circle cx="${x(i)}" cy="${y(p.v)}" r="${pts.length <= 31 ? 3 : 0}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`).join("")}

const S = D.sup;

function supOk(ci, f) {

}

function supSource(grain) {

function supAgg(grain, bucketKeys, f, by) {

  const wd = bucketKeys.reduce((a, k) => a + src.wd(k), 0);

  const keyOf = ci => by === "entity_code" ? S.suppliers[S.combos[ci][0]]?.entity : by ? S.combos[ci][SC.indexOf(by)] : "ALL";
  S.combos.forEach((r, ci) => { if (!supOk(ci, f)) return; const o = bucket(keyOf(ci)); o.capC += r[5] * wd; o.capQ += r[6] * wd; o.combos.add(ci); });
  for (const r of src.rows) { if (!tset.has(r[1]) || !supOk(r[0], f)) continue; const o = bucket(keyOf(r[0])); o.lines += r[2]; o.qty += r[3]; o.purchase += r[4]; o.planned += r[5] || 0; }
  for (const r of src.qd) { if (!tset.has(r[1]) || !supOk(r[0], f)) continue; const o = bucket(keyOf(r[0])); o.due += r[2]; o.ontime += r[3]; o.shipped += r[4]; o.defects += r[5]; }
  out.forEach(o => { o.loadC = o.capC ? o.lines / o.capC : null; o.loadQ = o.capQ ? o.qty / o.capQ : null; o.otd = o.due ? o.ontime / o.due : null; o.dr = o.shipped ? o.defects / o.shipped : null; });

}
function supBuckets() {

  if (def.grain === "day") {

    return {grain: "day", keys: [...def.keys, ...fwd], label: def.label, full: dlabel, futureFrom: def.keys.length};

  const fwdBy = supAgg("day", S.days.filter(d => d >= fwdStart && d <= S.forward_end), f, state.sby);
  const rows = [...byAgg.entries()].filter(([, o]) => o.capC > 0).map(([key, o]) => ({key, ...o, fwd: fwdBy.get(key)?.loadC, fwdQ: fwdBy.get(key)?.loadQ}))
    .sort((a, b) => Math.max(b.loadC ?? 0, b.loadQ ?? 0) - Math.max(a.loadC ?? 0, a.loadQ ?? 0));
  state._suprows = rows;
  const sa = supAlerts.filter(a => { const kv = Object.fromEntries(a.scope_key.split("|").map(x => x.split("="))); return Object.entries(f).every(([d, v]) => !v || (d === "entity_code" ? S.suppliers[kv.supplier_code]?.entity === v : !kv[d] || kv[d] === v || kv[d] === "*")); });
  const notes = (S.notifications || []).filter(n => sa.some(a => a.scope_key === n.scope_key) || n.reason === "解消");
  const tile = (name, v, sub, extra = "") => `<div class="tile static"><div class="name"><span>${name}</span>${extra}</div><div class="val num">${v}</div><div class="muted small">${sub}</div></div>`;
  const periodTxt = b.grain === "day" && b.keys.length === 1 ? dlabel(b.keys[0]) : `${b.full(win[0])}〜${b.full(win.at(-1))}`;
  return `<section class="panel">
    <p class="lead"><b>生産充足率</b>＝出荷日ベースの出荷（予定を含む）÷ サプライヤの供給能力（材質×サイズ×表面処理×熱処理ごとの日あたり上限 × 平日数）。<b>80%以下が目標</b>で、超えると逼迫としてアラートを出し、サプライヤ担当と上司に Teams で通知します（ダミーでは通知予定リストまで）。</p>
    ${periodSeg()}
    <div class="filters">
      <label for="sf-entity_code">現地法人<select id="sf-entity_code" data-sdim="entity_code">${filterOptions("entity_code", f.entity_code)}</select></label>
      ${sel("supplier_code", "サプライヤ", SOPT.supplier_code.filter(c => !f.entity_code || S.suppliers[c]?.entity === f.entity_code))}
      ${sel("material", "材質", SOPT.material)}${sel("part_size", "サイズ", SOPT.part_size)}${sel("surface", "表面処理", SOPT.surface)}${sel("heat", "熱処理", SOPT.heat)}
      ${Object.values(f).some(Boolean) ? `<button class="linkbtn" id="sf-reset" style="margin-bottom:6px">絞り込みを解除</button>` : ""}
    </div>
    ${b.note ? `<p class="lead">${b.note}</p>` : ""}
    <div class="tiles">
      ${tile("生産充足率（件数）", pct(tot.loadC), `${periodTxt}・出荷 ${num(tot.lines)}件／能力 ${num(tot.capC)}件`, lvlChip(tot.loadC))}
      ${tile("生産充足率（数量）", pct(tot.loadQ), `出荷 ${num(tot.qty)}個／能力 ${num(tot.capQ)}個`, lvlChip(tot.loadQ))}
      ${tile("今後の出荷予定の充足率", `${pct(fwd.loadC)} / ${pct(fwd.loadQ)}`, `件数 / 数量・${dlabel(fwdStart)}〜${dlabel(S.forward_end)}（受注済み分）`, lvlChip(Math.max(fwd.loadC ?? 0, fwd.loadQ ?? 0)))}
      ${tile("発注金額", yen(tot.purchase), `${periodTxt}（サプライヤへの発注額）`)}
      ${tile("納期遵守率", tot.otd != null ? (tot.otd * 100).toFixed(1) + "%" : "—", `納期到来 ${num(tot.due)}明細`)}
      ${tile("品質不良発生率", tot.dr != null ? (tot.dr * 100).toFixed(2) + "%" : "—", `出荷 ${num(tot.shipped)}明細・不良 ${num(tot.defects)}件`)}
    </div>
    <div class="grid2" style="margin-top:14px">
      <div class="card"><h3>生産充足率の推移 ${dlButtons("sup_trend", () => ({name: "生産充足率_推移", headers: ["期間", "充足率（件数）", "充足率（数量）", "出荷件数", "供給能力（件）", "出荷数量", "供給能力（数量）", "発注金額", "予定分（件）"],
          rows: state._suppts.map(p => [b.full(p.key), p.v, p.v2, p.o?.lines, p.o?.capC, p.o?.qty, p.o?.capQ, p.o?.purchase, p.o?.planned])}))}</h3>
        <p class="cap">点線は目標80%、赤線は供給能力の上限100%。${b.futureFrom != null ? "網掛けは今後の出荷予定（受注済み分のみ）。" : ""}</p>
        <div class="legend"><span><i style="border-color:var(--accent)"></i>件数ベース</span><span><i style="border-color:var(--series2)"></i>数量ベース</span></div>
        <div class="chart" id="sup-trend"></div></div>
      <div class="card"><h3>日別の受注負荷と発注金額 ${dlButtons("sup_daily", () => ({name: "日別負荷", headers: ["出荷日", "出荷（予定）件数", "日あたり供給可能件数", "充足率（件数）", "出荷数量", "供給可能数量", "発注金額", "うち予定（件）"],
          rows: state._supdaily.map(p => [p.key, p.o?.lines, p.o?.capC, p.o?.loadC, p.o?.qty, p.o?.capQ, p.o?.purchase, p.o?.planned])}))}</h3>
        <p class="cap">出荷日ベース。棒＝その日に出荷する（予定の）明細数、実線＝その日の供給可能件数、点線＝80%。下段は同じ日の発注金額。</p>
        <div class="chart" id="sup-daily"></div><div class="chart" id="sup-amount"></div></div>
    </div>
    <h2 class="sec">逼迫している領域 <small>${periodTxt}。行と列を選んで、どこに負荷が集中しているかを見る</small>
      ${dlButtons("sup_heat", () => ({name: "充足率ヒートマップ", headers: ["行", "列", "充足率（件数）", "充足率（数量）", "出荷件数", "供給能力（件）"], rows: state._heat || []}))}</h2>
    <div class="filters"><label for="sh-row">行<select id="sh-row" data-hdim="hrow">${["supplier_code","material","part_size","surface","heat"].map(d => `<option value="${d}" ${d === state.hrow ? "selected" : ""}>${DIM_LABEL[d]}</option>`).join("")}</select></label>
      <label for="sh-col">列<select id="sh-col" data-hdim="hcol">${["material","part_size","surface","heat","supplier_code"].map(d => `<option value="${d}" ${d === state.hcol ? "selected" : ""}>${DIM_LABEL[d]}</option>`).join("")}</select></label></div>
    <div class="tablewrap" id="sup-heat"></div>
    <h2 class="sec">${DIM_LABEL[state.sby]}別の充足率・品質・納期 <small>充足率の高い順。今後＝${dlabel(fwdStart)}〜${dlabel(S.forward_end)}の出荷予定</small>
      ${dlButtons("sup_table", () => ({name: `サプライヤ_${DIM_LABEL[state.sby]}別`, headers: [DIM_LABEL[state.sby], "出荷件数", "供給能力（件）", "充足率（件数）", "出荷数量", "供給能力（数量）", "充足率（数量）", "今後の充足率（件数）", "今後の充足率（数量）", "発注金額", "納期遵守率", "品質不良発生率"],
        rows: state._suprows.map(r => [supLabel(state.sby, r.key), r.lines, r.capC, r.loadC, r.qty, r.capQ, r.loadQ, r.fwd, r.fwdQ, r.purchase, r.otd, r.dr])}))}</h2>
    <div class="filters"><label for="sf-by">内訳<select id="sf-by">${byOpts}</select></label></div>
    <div class="tablewrap"><table><thead><tr><th>${DIM_LABEL[state.sby]}</th><th class="n">出荷／能力（件）</th><th>充足率（件数）</th><th>充足率（数量）</th><th>今後（件数／数量）</th><th class="n">発注金額</th><th class="n">納期遵守率</th><th class="n">品質不良率</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(supLabel(state.sby, r.key))} ${lvlChip(Math.max(r.loadC ?? 0, r.loadQ ?? 0))}</td><td class="n">${num(r.lines)} / ${num(r.capC)}</td><td>${loadBar(r.loadC)}</td><td>${loadBar(r.loadQ)}</td>
        <td class="num">${pct(r.fwd)} / ${pct(r.fwdQ)}</td><td class="n">${yen(r.purchase)}</td><td class="n">${r.otd != null ? (r.otd * 100).toFixed(1) + "%" : "—"}</td><td class="n">${r.dr != null ? (r.dr * 100).toFixed(2) + "%" : "—"}</td></tr>`).join("") || `<tr><td colspan="8" class="muted">該当なし</td></tr>`}
    </tbody></table></div>
    <h2 class="sec">供給アラートと打ち手 <small>${sa.length}件（絞り込みに該当するもの）</small></h2>
    ${sa.length ? `<div class="alist">${sa.map(a => alertCard(a, D.actions.find(x => x.alert_id === a.alert_id))).join("")}</div>` : `<p class="empty">充足率80%を超えている領域はありません。</p>`}
    <h2 class="sec">通知予定（Teams） <small>新規・悪化・解消のときだけ通知（同じ事象は毎日通知しない）</small>
      ${dlButtons("sup_notify", () => ({name: "通知予定", headers: ["通知ID", "日時", "手段", "宛先", "CC", "優先度", "理由", "件名", "本文", "状態"],
        rows: (S.notifications || []).map(n => [n.notify_id, n.created_at, n.channel, n.to, n.cc, n.priority, n.reason, n.title, n.message, n.status])}))}</h2>
    ${notes.length ? `<div class="tablewrap"><table><thead><tr><th>日時</th><th>宛先（担当）</th><th>CC（上司）</th><th>理由</th><th>件名</th><th>状態</th></tr></thead><tbody>
      ${notes.map(n => `<tr><td class="mono">${esc(n.created_at)}</td><td>${esc(n.to)}</td><td>${esc(n.cc)}</td><td>${esc(n.reason)}</td><td>${esc(n.title)}</td><td class="muted">${esc(n.status)}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="empty">今回の更新で新たに送る通知はありません。</p>`}
  </section>`;
}
function drawSupplier() {
  if (!S || !$("#sup-trend")) return;
  const f = state.sfilt, b = supBuckets();
  const pts = b.keys.map(k => { const o = supAgg(b.grain, [k], f, null).get("ALL"); return {key: k, v: o?.loadC ?? null, v2: o?.loadQ ?? null, o,
    extra: o ? `出荷 ${num(o.lines)}件／能力 ${num(o.capC)}件<br>発注金額 ${yen(o.purchase)}` : ""}; });
  state._suppts = pts;
  lineChart($("#sup-trend"), pts, b.label, b.full, v => (v * 100).toFixed(0) + "%", pct,
    {v2: true, v2Label: "数量ベース", vLabel: "件数ベース", zero: true, futureFrom: b.futureFrom,
     refs: [{value: 0.8, label: "目標80%", color: "var(--ink-2)"}, {value: 1, label: "上限100%", color: "var(--crit)", dash: "0"}]});
  // 日別の受注負荷（件数）と発注金額：同じ日付軸の2段（1つの軸に2つの尺度を混ぜない）
  const days = S.days.filter(d => d >= addDays(END, -29));
  const dp = days.map(d => ({key: d, o: supAgg("day", [d], f, null).get("ALL")}));
  state._supdaily = dp;
  barChart($("#sup-daily"), dp, d => `${+d.slice(5, 7)}/${+d.slice(8)}`, p => p.o?.lines ?? 0, p => isWd(p.key) ? p.o?.capC ?? 0 : null,
    p => `<b>${dlabel(p.key)}</b>${p.key > END ? "（予定）" : ""}<br>出荷 ${num(p.o?.lines)}件（うち予定 ${num(p.o?.planned)}）<br>供給可能 ${num(p.o?.capC)}件（充足率 ${pct(p.o?.loadC)}）<br>数量 ${num(p.o?.qty)}／能力 ${num(p.o?.capQ)}<br>発注金額 ${yen(p.o?.purchase)}`, 170, true);
  barChart($("#sup-amount"), dp, d => `${+d.slice(5, 7)}/${+d.slice(8)}`, p => p.o?.purchase ?? 0, null,
    p => `<b>${dlabel(p.key)}</b><br>発注金額 ${yen(p.o?.purchase)}`, 90, false, v => (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + "百万");
  drawHeat();
}
function barChart(el, pts, labelOf, getV, getCap, tipOf, H, withCap, fmtAxis = v => Math.round(v).toLocaleString()) {
  if (!el) return;
  const W = Math.max(el.clientWidth, 280), L = 56, R = 10, T = 8, B = 22;
  const vals = pts.map(getV), caps = getCap ? pts.map(getCap) : [];
  const hi = Math.max(1, ...vals, ...caps.filter(c => c != null)) * 1.1;
  const n = pts.length, bw = (W - L - R) / n;
  const y = v => T + (1 - v / hi) * (H - T - B);
  const step = Math.ceil(n / Math.max(4, Math.floor((W - L) / 46)));
  const capPath = getCap ? pts.map((p, i) => caps[i] == null ? null : [L + i * bw, y(caps[i]), L + (i + 1) * bw]).map((c, i) => c ? `M${c[0].toFixed(1)},${c[1].toFixed(1)}H${c[2].toFixed(1)}` : "").join("") : "";
  const cap80 = getCap ? pts.map((p, i) => caps[i] == null ? "" : `M${(L + i * bw).toFixed(1)},${y(caps[i] * 0.8).toFixed(1)}H${(L + (i + 1) * bw).toFixed(1)}`).join("") : "";
  const endIdx = pts.findIndex(p => p.key > END);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">
    ${endIdx >= 0 ? `<rect x="${L + endIdx * bw}" y="${T}" width="${W - R - L - endIdx * bw}" height="${H - T - B}" fill="var(--surface-2)"/>` : ""}
    <g class="grid">${[0, 0.5, 1].map(t => `<line x1="${L}" x2="${W - R}" y1="${y(hi / 1.1 * t)}" y2="${y(hi / 1.1 * t)}"/>`).join("")}</g>
    ${[0, 0.5, 1].map(t => `<text x="${L - 6}" y="${y(hi / 1.1 * t) + 3.5}" text-anchor="end">${fmtAxis(hi / 1.1 * t)}</text>`).join("")}
    ${pts.map((p, i) => { const v = vals[i], over = withCap && caps[i] && v > caps[i] * 0.8; const col = over ? (v > caps[i] ? "var(--crit)" : "var(--serious)") : "var(--accent)";
      return `<rect x="${(L + i * bw + 1).toFixed(1)}" y="${y(v).toFixed(1)}" width="${Math.max(bw - 2, 1).toFixed(1)}" height="${(H - B - y(v)).toFixed(1)}" rx="2" fill="${col}" opacity="${p.key > END ? 0.55 : 1}"/>`; }).join("")}
    ${capPath ? `<path d="${capPath}" stroke="var(--crit)" stroke-width="2" fill="none"/><path d="${cap80}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>` : ""}
    ${pts.map((p, i) => (n - 1 - i) % step === 0 ? `<text x="${L + (i + 0.5) * bw}" y="${H - 6}" text-anchor="middle">${esc(labelOf(p.key))}</text>` : "").join("")}
    ${pts.map((p, i) => `<rect class="hb" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/>`).join("")}</svg>`;
  el.querySelectorAll(".hb").forEach(r => { r.addEventListener("mousemove", e => showTip(e, tipOf(pts[+r.dataset.i]))); r.addEventListener("mouseleave", hideTip); });
}
function drawHeat() {
  const el = $("#sup-heat"); if (!el) return;
  const f = state.sfilt, b = supBuckets(), win = b.grain === "day" ? b.keys.filter(k => k <= END) : b.keys;
  const rd = state.hrow, cd = state.hcol === rd ? (rd === "material" ? "part_size" : "material") : state.hcol;
  const src = supSource(b.grain), tIdx = new Map(src.keys.map((k, i) => [k, i])), tset = new Set(win.map(k => tIdx.get(k)).filter(i => i != null));
  const wd = win.reduce((a, k) => a + src.wd(k), 0);
  const cell = new Map(), ri = SC.indexOf(rd), cix = SC.indexOf(cd);
  const get = (r, c) => { const k = r + "\u0000" + c; let o = cell.get(k); if (!o) { o = {lines: 0, qty: 0, capC: 0, capQ: 0}; cell.set(k, o); } return o; };
  S.combos.forEach((r, ci) => { if (!supOk(ci, f)) return; const o = get(r[ri], r[cix]); o.capC += r[5] * wd; o.capQ += r[6] * wd; });
  for (const r of src.rows) { if (!tset.has(r[1]) || !supOk(r[0], f)) continue; const c = S.combos[r[0]]; const o = get(c[ri], c[cix]); o.lines += r[2]; o.qty += r[3]; }
  const rows = [...new Set([...cell.keys()].map(k => k.split("\u0000")[0]))].sort(), cols = [...new Set([...cell.keys()].map(k => k.split("\u0000")[1]))].sort();
  const heat = [];
  const td = (r, c) => { const o = cell.get(r + "\u0000" + c); if (!o || !o.capC) return `<td class="hm empty-c"></td>`;
    const v = Math.max(o.lines / o.capC, o.capQ ? o.qty / o.capQ : 0); heat.push([supLabel(rd, r), supLabel(cd, c), o.lines / o.capC, o.capQ ? o.qty / o.capQ : null, o.lines, o.capC]);
    const cls = v > 0.95 ? "hm crit" : v > 0.8 ? "hm warn" : "hm";
    const a = Math.min(v, 1) * 0.55;
    return `<td class="${cls}" style="--a:${a.toFixed(2)}" title="${esc(supLabel(rd, r))} × ${esc(supLabel(cd, c))}：件数 ${pct(o.lines / o.capC)}・数量 ${pct(o.capQ ? o.qty / o.capQ : null)}（${num(o.lines)}／${num(o.capC)}件）">${pct(v)}</td>`; };
  el.innerHTML = `<table class="heat"><thead><tr><th>${DIM_LABEL[rd]} ＼ ${DIM_LABEL[cd]}</th>${cols.map(c => `<th>${esc(supLabel(cd, c))}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr><th>${esc(supLabel(rd, r))}</th>${cols.map(c => td(r, c)).join("")}</tr>`).join("")}</tbody></table>
    <p class="muted small" style="padding:6px 10px">セルの値は件数・数量ベースの高い方。橙＝80%超、赤＝95%超。空欄は供給能力なし。</p>`;
  state._heat = heat;
}

// ---------- 描画
function render() {
  renderTabs();
  const main = $("#main");
  main.innerHTML = {summary: renderSummary, analysis: renderAnalysis, supplier: renderSupplier, alerts: renderAlerts, actions: renderActions, dq: renderDQ, defs: renderDefs}[state.tab]();
  if (state.tab === "analysis") { drawTrend(); drawContrib(); }
  if (state.tab === "supplier") drawSupplier();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-kpi],[data-open],[data-sopen],[data-go],[data-prio],[data-cat],[data-period],[data-dl],#f-reset,#sf-reset");
  if (!t) return;
  if (t.dataset.dl) { doDownload(t.dataset.dl, t.dataset.fmt); return; }
  if (t.dataset.period) { state.period = t.dataset.period; save(); render(); return; }
  if (t.dataset.kpi) { state.kpi = t.dataset.kpi; state.filt = {}; state.month = TM; go("analysis"); }
  else if (t.dataset.open) {
    const [k, key, m] = t.dataset.open.split("|");
    state.kpi = k; state.month = MONTHS.includes(m) ? m : TM; state.filt = {};
    if (key !== "ALL") key.split("|").forEach(kv => { const [d, v] = kv.split("="); if (DIMS[d]) state.filt[d] = v; });
    const f = Object.keys(state.filt);
    state.period = "all";
    state.by = f.includes("entity_code") && f.includes("product_code") ? "customer_id" : f.includes("entity_code") ? "product_code" : f.includes("product_code") ? "entity_code" : f.includes("section_code") ? "customer_id" : "entity_code";
    go("analysis");
  }
  else if (t.dataset.sopen) {
    state.sfilt = {};
    t.dataset.sopen.split("|").forEach(kv => { const [d, v] = kv.split("="); if (v && v !== "*") state.sfilt[d] = v; });
    state.sby = state.sfilt.material ? "part_size" : "material";
    go("supplier");
  }
  else if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.prio) { state.prio = t.dataset.prio; render(); }
  else if (t.dataset.cat) { state.cat = t.dataset.cat; render(); }
  else if (t.id === "f-reset") { state.filt = {}; render(); }
  else if (t.id === "sf-reset") { state.sfilt = {}; render(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "f-kpi") state.kpi = t.value;
  else if (t.id === "f-month") state.month = t.value;
  else if (t.id === "f-by") state.by = t.value;
  else if (t.id === "f-day") state.day = t.value;
  else if (t.id === "sf-by") state.sby = t.value;
  else if (t.dataset.sdim) { state.sfilt[t.dataset.sdim] = t.value; if (t.dataset.sdim === "entity_code") delete state.sfilt.supplier_code; }
  else if (t.dataset.hdim) state[t.dataset.hdim] = t.value;
  else if (t.dataset.dim) state.filt[t.dataset.dim] = t.value;
  else return;
  render();
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (state.tab === "analysis") { drawTrend(); drawContrib(); } if (state.tab === "supplier") drawSupplier(); }, 120); });
render();
})();
</script>
